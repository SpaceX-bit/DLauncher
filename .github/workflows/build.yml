# Собирает установщик DLauncher (Python + Qt) для Windows x64 на GitHub — на своём компьютере ничего ставить не нужно.
# Запуск: Actions -> Build Windows installer -> Run workflow. Либо выложи тег v2.0.0 — тогда установщик сам прикрепится к релизу.
name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt

      # Проект можно загрузить в репозиторий одним zip-файлом (любое имя). Если zip несколько,
      # берётся тот, где в dlauncher/__init__.py самая новая версия; он ложится поверх старых файлов
      - name: Unpack project from zip
        shell: pwsh
        run: |
          $best = $null
          foreach ($z in Get-ChildItem -Filter *.zip) {
            $d = Join-Path '_unz' $z.BaseName
            Expand-Archive -LiteralPath $z.FullName -DestinationPath $d -Force
            $init = Get-ChildItem $d -Recurse -Filter __init__.py | Where-Object { $_.Directory.Name -eq 'dlauncher' -and (Test-Path (Join-Path $_.Directory.Parent.FullName 'main.py')) } | Select-Object -First 1
            if ($init) {
              $m = Select-String -Path $init.FullName -Pattern '__version__\s*=\s*"([^"]+)"' | Select-Object -First 1
              $v = [version]$m.Matches[0].Groups[1].Value
              Write-Host "Found $($z.Name): version $v"
              if (-not $best -or $v -gt $best.v) { $best = @{ v = $v; dir = $init.Directory.Parent.FullName } }
            }
          }
          if (-not $best) {
            Write-Host '=== ERROR: no DLauncher (Python) project .zip found in the repository root. Upload the project zip to the repo root. ==='
            Get-ChildItem | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "Using project version $($best.v)"
          # стираем старые файлы проекта (кроме .git, .github, zip и _unz), чтобы не собралась старая версия
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git', '.github', '_unz') -and $_.Extension -ne '.zip' } | Remove-Item -Recurse -Force
          Copy-Item -Path (Join-Path $best.dir '*') -Destination . -Recurse -Force
          # workflow из zip не подставляем — работает тот, что уже лежит в репозитории
          Get-ChildItem | Select-Object -ExpandProperty Name
          $ver = (Select-String -Path dlauncher/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "=== BUILDING DLauncher version $ver ==="
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Если репозиторий для автообновления не вписан, берём этот самый репозиторий
      - name: Set update repository
        shell: python
        env:
          REPO: ${{ github.repository }}
        run: |
          import json, os
          c = json.load(open('update-config.json', encoding='utf-8'))
          if not c.get('repo'):
              c['repo'] = os.environ['REPO']
              json.dump(c, open('update-config.json', 'w', encoding='utf-8'), indent=2)
          print('update repo:', c['repo'])

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1 pytest

      - name: Unit tests (core)
        continue-on-error: true  # часть тестов рассчитана на Linux; на сборку не влияет
        run: python -m pytest -q tests/test_base.py tests/test_launch.py tests/test_mods.py tests/test_modsmgr.py

      # Запускает все вкладки без показа окна. Если где-то ошибка — сборка остановится и в логе будет причина
      - name: Interface self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DLAUNCHER_DATA: ${{ runner.temp }}\dl-selftest
          DLAUNCHER_SHOTS: shots
        run: python main.py --selftest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DLauncher-screenshots
          path: shots/*.png
          if-no-files-found: ignore

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/DLauncher.spec --noconfirm

      # Проверяем, что собранная программа запускается (в ней свой Python и Qt)
      - name: Self-test of the built app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DLAUNCHER_DATA: ${{ runner.temp }}\dl-selftest2
        run: |
          $p = Start-Process -FilePath dist\DLauncher\DLauncher.exe -ArgumentList '--selftest' -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path "$env:DLAUNCHER_DATA\launcher.log") { Get-Content "$env:DLAUNCHER_DATA\launcher.log" -Tail 40 }
          if ($p.ExitCode -ne 0) { exit 1 }

      # ---- Подпись (необязательно). Без секретов эти шаги пропускаются, сборка идёт как раньше.
      # Вариант А: свой сертификат .pfx. Секреты репозитория: CODESIGN_PFX (файл .pfx в base64) и CODESIGN_PASSWORD.
      - name: Sign app (own certificate)
        if: env.CODESIGN_PFX != ''
        shell: pwsh
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:CODESIGN_PFX))
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d DLauncher dist\DLauncher\DLauncher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      - name: Sign installer (own certificate)
        if: env.CODESIGN_PFX != ''
        shell: pwsh
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          Get-ChildItem dist\DLauncher-Setup-*.exe | ForEach-Object {
            & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "DLauncher installer" $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Вариант Б: бесплатная подпись SignPath Foundation для открытых проектов.
      # Нужны: секрет SIGNPATH_API_TOKEN и переменные репозитория SIGNPATH_ORG_ID, SIGNPATH_PROJECT, SIGNPATH_POLICY
      - name: Upload unsigned installer (for SignPath)
        if: vars.SIGNPATH_ORG_ID != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: DLauncher-unsigned
          path: dist/DLauncher-Setup-*.exe

      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Put signed installer into dist
        if: vars.SIGNPATH_ORG_ID != ''
        shell: pwsh
        run: |
          $zip = Get-ChildItem signed -Filter *.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) { Expand-Archive -LiteralPath $zip.FullName -DestinationPath signed\x -Force }
          $exe = Get-ChildItem signed -Recurse -Filter DLauncher-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Signed installer not found in SignPath output' }
          Copy-Item $exe.FullName dist\ -Force

      # Показываем, подписан ли установщик (не останавливает сборку, если подписи нет)
      - name: Show installer signature
        shell: pwsh
        run: |
          Get-ChildItem dist\DLauncher-Setup-*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): signature = $($sig.Status); signer = $($sig.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DLauncher-windows
          path: dist/DLauncher-Setup-*.exe

      # Заметки релиза берутся из окна «Что нового» (первая запись) — их лаунчер покажет в окне обновления
      - name: Release notes
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import sys
          sys.path.insert(0, '.')
          from dlauncher.ui.dialogs.changelog import CHANGES
          ver, items = CHANGES[0]
          open('release-notes.md', 'w', encoding='utf-8').write('\n'.join('- ' + i for i in items) + '\n')

      # Релиз создаётся сам (и по тегу, и по ручному запуску): по нему лаунчеры находят обновление
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: DLauncher ${{ env.APP_VERSION }}
          body_path: release-notes.md
          make_latest: true
          files: dist/DLauncher-Setup-*.exe
