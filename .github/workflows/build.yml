name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack project from zip
        shell: pwsh
        run: |
          $best = $null
          foreach ($z in Get-ChildItem -Filter *.zip) {
            $d = Join-Path '_unz' $z.BaseName
            Expand-Archive -LiteralPath $z.FullName -DestinationPath $d -Force
            $pj = Get-ChildItem $d -Recurse -Filter package.json | Where-Object { $_.FullName -notmatch 'node_modules' } | Select-Object -First 1
            if ($pj) {
              $v = [version]((Get-Content $pj.FullName -Raw | ConvertFrom-Json).version)
              Write-Host "Found $($z.Name): version $v"
              if (-not $best -or $v -gt $best.v) { $best = @{ v = $v; dir = $pj.DirectoryName } }
            }
          }
          if (-not $best) {
            Write-Host '=== ERROR: no project .zip with package.json found in the repository root. Upload the DLauncher zip (v1.7.2) to the repo root. ==='
            Get-ChildItem | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "Using project version $($best.v)"
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git', '.github', '_unz') -and $_.Extension -ne '.zip' } | Remove-Item -Recurse -Force
          Copy-Item -Path (Join-Path $best.dir '*') -Destination . -Recurse -Force
          $final = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "=== BUILDING DLauncher version $final ==="
          if ([version]$final -ne $best.v) { Write-Host 'ERROR: version mismatch after copy'; exit 1 }
          Get-ChildItem | Select-Object -ExpandProperty Name

      - name: Set update repository
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('update-config.json','utf8'));if(!c.repo){c.repo=process.env.REPO;fs.writeFileSync('update-config.json',JSON.stringify(c,null,2)+'\n');}console.log('update repo:',c.repo)"

      - run: npm install

      - name: Build
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0 -and (Test-Path build/installer.nsh)) {
            Write-Host 'Build failed, retrying with the standard installer wizard'
            Rename-Item build/installer.nsh installer.nsh.off
            npm run build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: DLauncher-windows
          path: |
            dist/*-nsis.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-nsis.exe
            dist/*.blockmap
            dist/latest.yml
