name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack project from zip if needed
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
          if ($zip) {
            Write-Host "Unpacking $($zip.Name)"
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath _unz -Force
            $found = Get-ChildItem _unz -Recurse -Filter package.json | Where-Object { $_.FullName -notmatch 'node_modules' } | Select-Object -First 1
            if ($found) { Copy-Item -Path (Join-Path $found.DirectoryName '*') -Destination . -Recurse -Force }
          }
          if (-not (Test-Path package.json)) {
            Write-Host 'package.json not found: upload the project files or the project .zip to the repository root'
            exit 1
          }
          Get-ChildItem | Select-Object -ExpandProperty Name

      - name: Set update repository
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('update-config.json','utf8'));if(!c.repo){c.repo=process.env.REPO;fs.writeFileSync('update-config.json',JSON.stringify(c,null,2)+'\n');}console.log('update repo:',c.repo)"

      - run: npm install

      - name: Build
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0 -and (Test-Path build/installer.nsh)) {
            Write-Host 'Build failed, retrying with the standard installer wizard'
            Rename-Item build/installer.nsh installer.nsh.off
            npm run build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: DLauncher-windows-x64
          path: |
            dist/*-x64-nsis.exe
            dist/*-x64-portable.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-x64-nsis.exe
            dist/*-x64-portable.exe
            dist/*.blockmap
            dist/latest.yml
